<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نموذج حجز - أبحث بلا حدود</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background: #f1f1f1; padding: 20px; }
    h2 { text-align: center; color: #4A148C; }
    form { background: #fff; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, textarea, select {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px;
    }
    button {
      margin-top: 20px; background: #6A1B9A; color: white;
      padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;
    }
    .success {
      background: #d4edda; color: #155724;
      padding: 10px; margin-top: 15px; border-radius: 5px;
      display: none;
    }
  </style>
</head>
<body>

<h2>نموذج طلب كتابة بحث</h2>

<form id="researchForm">
  <label>الاسم الكامل:</label>
  <input type="text" required>

  <label>رقم الهاتف / واتساب:</label>
  <input type="tel" required>

  <label>البريد الإلكتروني (اختياري):</label>
  <input type="email">

  <label>عنوان البحث المطلوب:</label>
  <input type="text" required>

  <label>التخصص / الكلية:</label>
  <input type="text" required>

  <label>تفاصيل إضافية:</label>
  <textarea rows="4"></textarea>

  <button type="submit">إرسال الطلب</button>

  <div class="success" id="successMessage">تم إرسال طلبك بنجاح! سنتواصل معك قريبًا.</div>
</form>

<script>
  const form = document.getElementById('researchForm');
  const successMessage = document.getElementById('successMessage');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    successMessage.style.display = 'block';
    form.reset();
  });
</script>

</body>
  </html>
